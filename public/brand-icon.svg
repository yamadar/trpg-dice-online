<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Dice &amp; Chat</title>
  <defs>
    <linearGradient id="g" x1="16" y1="16" x2="496" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8DF6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Speech bubble: a near-canvas-filling circle with a teardrop tail
       protruding into the bottom-left corner. The tail's upper edge runs
       almost straight from (47,383) on the bubble down to the tip at
       (5,482); the lower edge is a tight quadratic curve that sweeps back
       up to the bubble outline at (201,495). The two attach angles (≈149°
       upper, ≈103° lower) and an offset gradient endpoint mirror the PWA
       PNG icon. -->
  <path d="M 256,11
           A 245,245 0 1 1 201,495
           Q 70,524 5,482
           L 47,383
           A 245,245 0 0 1 256,11 Z"
        fill="none" stroke="url(#g)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- D20 (hexagon + inscribed hexagram + "20") inside the bubble.
       Shifted slightly up so the tail does not crowd the lower face. -->
  <g stroke="#fff" stroke-width="12" stroke-linejoin="round" fill="none">
    <polygon points="255,49 398.8,132 398.8,298 255,381 111.2,298 111.2,132" fill="url(#g)"/>
    <polygon points="255,49 398.8,298 111.2,298"/>
    <polygon points="255,381 111.2,132 398.8,132"/>
  </g>
  <text x="255" y="215" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-weight="800" font-size="135" fill="#fff" letter-spacing="-4">20</text>
</svg>
