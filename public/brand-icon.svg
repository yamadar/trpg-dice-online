<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Dice &amp; Chat</title>
  <defs>
    <linearGradient id="g" x1="16" y1="16" x2="496" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8DF6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Speech bubble: a near-canvas-filling circle with a teardrop tail
       protruding into the bottom-left corner. The tail's upper edge runs
       from (55,397) on the bubble to the tip at (22,482); the lower edge
       is a tight quadratic curve that sweeps back up to the bubble
       outline at (201,495). Tip and control point are kept inboard by at
       least half the stroke width so the rounded join cannot render
       outside the 0..512 viewBox in any browser. -->
  <path d="M 256,11
           A 245,245 0 1 1 201,495
           Q 80,510 22,482
           L 55,397
           A 245,245 0 0 1 256,11 Z"
        fill="none" stroke="url(#g)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- D20 (hexagon + inscribed hexagram + "20") centred inside the bubble.
       Sits at the canvas centre so the tail extends below it without
       pushing the die off-axis. -->
  <g stroke="#fff" stroke-width="12" stroke-linejoin="round" fill="none">
    <polygon points="256,90 399.8,173 399.8,339 256,422 112.2,339 112.2,173" fill="url(#g)"/>
    <polygon points="256,90 399.8,339 112.2,339"/>
    <polygon points="256,422 112.2,173 399.8,173"/>
  </g>
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-weight="800" font-size="135" fill="#fff" letter-spacing="-4">20</text>
</svg>
