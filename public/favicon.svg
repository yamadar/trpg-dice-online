<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Dice &amp; Chat</title>
  <defs>
    <linearGradient id="g" x1="48" y1="16" x2="464" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8DF6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Top-down d20 silhouette: outer pointy-top hexagon with an inscribed
       hexagram. Star edges are stroked white so the gradient inside reads
       as 6 visible facets just like a real die. -->
  <g stroke="#fff" stroke-width="18" stroke-linejoin="round" fill="none">
    <polygon points="256,16 464,136 464,376 256,496 48,376 48,136" fill="url(#g)"/>
    <polygon points="256,16 464,376 48,376"/>
    <polygon points="256,496 48,136 464,136"/>
  </g>
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-weight="800" font-size="190" fill="#fff" letter-spacing="-6">20</text>
</svg>
