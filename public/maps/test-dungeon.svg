<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <pattern id="stone" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#3a3a44"/>
      <path d="M 0 0 L 100 0 L 100 100 L 0 100 Z" fill="none" stroke="#1f1f25" stroke-width="2"/>
      <circle cx="20" cy="30" r="3" fill="#4a4a55"/>
      <circle cx="70" cy="60" r="2" fill="#4a4a55"/>
      <circle cx="50" cy="80" r="2.5" fill="#2c2c33"/>
    </pattern>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none"/>
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1a1a20" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="1500" height="1000" fill="url(#stone)"/>
  <rect width="1500" height="1000" fill="url(#grid)"/>
  <g font-family="serif" fill="#a08060" text-anchor="middle">
    <text x="750" y="80" font-size="40" font-weight="bold">Stone Dungeon (test)</text>
