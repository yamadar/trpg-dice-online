<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- Browsers that understand SVG icons prefer the crisp vector; older
         clients (and most tab favicons) fall back to the .ico. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <!-- iOS home-screen icon. 1024x1024 lets iOS scale to any device class. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-1024.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Online TRPG dice roller with rooms, chat and GM hidden rolls / オンラインTRPGダイスローラー" />
    <!-- PWA: standalone launch on iOS is driven by apple-mobile-web-app-capable;
         Android / Chrome derives the same behaviour from the web manifest's
         `display: standalone` and ignores these metas. mobile-web-app-capable
         is kept as a best-effort hint for older Chromium-based browsers that
         predate full manifest support. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TRPG Dice" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Matches the default midnight theme's --bg so the browser chrome /
         status bar blend with the app on first paint. -->
    <meta name="theme-color" content="#14151c" />
    <title>TRPG Online Dice / オンラインダイス</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
